<title>Nakishima Cassette Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: beige tape-deck housing; totals are two amber CRT readouts, tabs are piano keys (Side A / Side B), items are labelled cassette shells. */
:root {
  color-scheme: light;
  --bg: #d8d0bd;          /* putty plastic housing */
  --panel: #e6dfcf;       /* raised panel */
  --panel-edge: #a39981;
  --ink: #24211b;
  --ink-2: #5d5646;
  --screen: #11120e;      /* CRT glass */
  --amber: #ffb13b;
  --amber-dim: #b98236;
  --s1: #e8542b; --s2: #f2a51a; --s3: #c8352b; --s4: #3a6e8f;   /* packaging stripes */
  --c1: #e8542b; --c2: #f2a51a; --c3: #3a6e8f; --c4: #6d9a6f;
  --font-display: 'Michroma', 'Eurostile', 'Arial Black', sans-serif;
  --font-crt: 'VT323', 'Courier New', monospace;
  --font-body: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; min-height: 100%;
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; }
.sky { display: none; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap::before { content: ""; display: block; height: 22px; border-radius: 3px;
  background: linear-gradient(var(--s1) 0 25%, var(--s2) 25% 50%, var(--s3) 50% 75%, var(--s4) 75% 100%); }

.glass { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.10), 0 3px 0 var(--panel-edge), 0 14px 24px -16px rgba(40,30,10,.55); }

header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; padding-inline: 2px; }
.stamp { font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px; }
.total { all: unset; box-sizing: border-box; cursor: pointer; position: relative; overflow: hidden; min-width: 0;
  display: flex; flex-direction: column; gap: 6px; padding: 20px 22px 18px; border-radius: 14px / 18px;
  background: radial-gradient(120% 140% at 50% 40%, #1b1d16, var(--screen) 70%); color: var(--amber);
  border: 3px solid #2d2b25; box-shadow: inset 0 0 26px rgba(0,0,0,.85), 0 0 0 4px #bdb39c, 0 2px 0 5px var(--panel-edge); }
.total::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px), linear-gradient(160deg, rgba(255,255,255,.07), transparent 45%); }
.total:not([aria-current="true"]) { filter: saturate(.55) brightness(.72); }
.total:hover { filter: none; }
.total[aria-current="true"] .eyebrow::before { content: "\25CF  PLAY  "; color: var(--s1); }
.eyebrow { font-family: var(--font-display); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.total .eyebrow { color: var(--amber-dim); }
.big { font-family: var(--font-display); font-size: clamp(30px, 5.4vw, 54px); line-height: 1.1; letter-spacing: .02em; font-variant-numeric: tabular-nums;
  color: var(--amber); text-shadow: 0 0 6px rgba(255,170,60,.65), 0 0 22px rgba(255,140,30,.35); }
.big small { font-size: .38em; color: var(--amber-dim); margin-right: .25em; text-shadow: none; }
.sub { font-family: var(--font-crt); font-size: 19px; line-height: 1.15; color: var(--amber-dim); }
.combined { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; align-items: baseline;
  padding: 10px 6px 0; border-top: 2px groove rgba(255,255,255,.5); font-family: var(--font-display); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.combined b { font-family: var(--font-display); color: var(--ink); font-size: 13px; letter-spacing: .06em; }

.split { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
.bar { display: flex; gap: 4px; height: 22px; padding: 4px; border-radius: 4px; background: var(--screen); box-shadow: inset 0 2px 6px rgba(0,0,0,.8); }
.bar i { display: block; min-width: 9px; background: repeating-linear-gradient(90deg, var(--c) 0 7px, transparent 7px 10px); filter: drop-shadow(0 0 3px var(--c)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend em { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend b { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend u { text-decoration: none; color: var(--ink-2); }

.bar-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; gap: 6px; padding: 8px 8px 11px; }
.seg button { all: unset; box-sizing: border-box; cursor: pointer; position: relative; padding: 11px 16px 10px 30px; border-radius: 4px;
  font-family: var(--font-display); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
  background: linear-gradient(#f4efe3, #d2c9b4); border: 1px solid #8f866f; box-shadow: 0 4px 0 #8f866f, inset 0 1px 0 #fff; transition: transform .08s, box-shadow .08s; }
.seg button::before { content: ""; position: absolute; left: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #6f4a3a; box-shadow: inset 0 1px 1px rgba(0,0,0,.5); }
.seg button[aria-selected="true"] { transform: translateY(3px); box-shadow: 0 1px 0 #8f866f, inset 0 2px 4px rgba(0,0,0,.15); background: linear-gradient(#e2dac8, #cbc1aa); }
.seg button[aria-selected="true"]::before { background: var(--s1); box-shadow: 0 0 6px var(--s1), 0 0 2px #fff inset; }
.seg button span { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; opacity: .65; letter-spacing: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=search], select { font-family: var(--font-crt); font-size: 20px; line-height: 1; color: var(--amber); background: var(--screen); border: 2px solid #2d2b25; border-radius: 4px;
  padding: 7px 12px; min-width: 0; box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 0 0 3px #bdb39c; }
input[type=search] { width: min(260px, 100%); }
input::placeholder { color: var(--amber-dim); opacity: .8; }
select option { color: #24211b; background: #f4efe3; font-family: var(--font-body); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 12px; border-radius: 3px; font-family: var(--font-display); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(#f4efe3, #d2c9b4); border: 1px solid #8f866f; box-shadow: 0 3px 0 #8f866f; }
.chip[aria-pressed="true"] { background: var(--s1); color: #fff7ea; border-color: #9e3417; box-shadow: 0 1px 0 #9e3417, inset 0 2px 3px rgba(0,0,0,.2); transform: translateY(2px); }
.chip span { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; opacity: .75; letter-spacing: 0; }
.count { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .04em; }
.count b { color: var(--ink); font-weight: 600; }
.total:focus-visible, .seg button:focus-visible, .chip:focus-visible, .item:focus-visible, .close:focus-visible, select:focus-visible, input:focus-visible, .btn:focus-visible { outline: 3px solid var(--s4); outline-offset: 3px; }

.grid { display: grid; gap: 16px; }
.grid.v { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.p { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.grid.s { display: block; }
.desk { position: relative; aspect-ratio: 16 / 6.4; border-radius: 6px; overflow: hidden; border: 6px solid #2a2823; box-shadow: 0 0 0 1px #8f866f, 0 14px 30px rgba(40,30,15,.25);
  background: radial-gradient(120% 90% at 50% 0%, rgba(255,214,150,.16), transparent 60%), repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 7px), linear-gradient(180deg, #5b4632, #4a3826 60%, #3d2e20); }
.desk::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7%; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent); }
.desk .thing { all: unset; position: absolute; cursor: pointer; transition: transform .2s, filter .2s; filter: drop-shadow(0 10px 10px rgba(0,0,0,.45)); }
.desk .thing img { display: block; width: 100%; height: auto; }
.desk .thing:hover, .desk .thing:focus-visible { transform: translateY(-4px); filter: drop-shadow(0 16px 14px rgba(0,0,0,.5)) drop-shadow(0 0 2px var(--amber)); }
.desk .kb { left: 4%; top: 19%; width: 52%; } .desk .kb img { border-radius: 1.4% / 3.3%; }
.desk .pad { left: 60.5%; top: 11%; width: 29%; } .desk .pad img { border-radius: 3% / 3.5%; }
.desk .mouse { left: 72.5%; top: 32%; width: 5%; z-index: 2; }
.desk .iem { left: 91.5%; top: 20%; width: 6%; transform: rotate(8deg); }
.desk .iem:hover, .desk .iem:focus-visible { transform: rotate(8deg) translateY(-4px); }
.desk .tag { position: absolute; left: 50%; bottom: -2.2em; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #f3e6c8; background: rgba(20,18,14,.82); border: 1px solid rgba(255,190,90,.35); padding: 3px 7px; border-radius: 2px; pointer-events: none; }
.desk .tag b { color: var(--amber); font-weight: 600; margin-left: 6px; }
.desk .pad .tag { bottom: -2.4em; } .desk .mouse .tag, .desk .iem .tag { display: none; }
.desk .thing:hover .tag, .desk .thing:focus-visible .tag { display: block; }
.rack { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.rack button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; background: var(--panel, #e6dfcf); border: 1px solid #b9ae94; border-radius: 4px; box-shadow: 0 3px 0 #a99e84; }
.rack button:hover, .rack button:focus-visible { outline: 2px solid var(--s1); }
.rack .k { grid-column: 1 / -1; font-family: var(--font-crt); font-size: 17px; color: var(--amber-dim); }
.rack .n { font-weight: 700; font-size: 13px; } .rack .m { grid-column: 1; font-size: 12px; opacity: .7; }
.rack .pr { grid-row: 2 / span 2; grid-column: 2; align-self: center; font-family: var(--font-mono); font-weight: 700; font-size: 12px; background: #1d1b17; color: #f3e6c8; padding: 4px 8px; border-radius: 2px; }
@media (max-width: 640px) { .desk .tag { display: none !important; } .desk { border-width: 4px; } }
.item .kind { font-family: var(--font-crt); font-size: 17px; color: var(--amber-dim); letter-spacing: .04em; }
.parts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.parts li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed rgba(0,0,0,.18); padding-bottom: 6px; }
.parts li span:last-child { white-space: nowrap; font-weight: 600; }
.item { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 9px 9px 11px; min-width: 0; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--panel-edge);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 var(--panel-edge), 0 12px 18px -14px rgba(40,30,10,.6); transition: transform .15s; }
.item:hover { transform: translateY(-2px); }
.art { position: relative; overflow: hidden; width: 100%; border-radius: 3px; border: 5px solid #2a2823; background: #2a2823; box-shadow: 0 0 0 1px #8f866f; }
.art.sq { aspect-ratio: 1 / 1; display: grid; place-items: center; }
.art.pt { aspect-ratio: 55 / 85; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* flip-to-play vinyl tiles */
.item.vi { cursor: default; }
.item.vi:hover { transform: none; }
.open { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; }
.open.meta { display: flex; }
.flip { perspective: 900px; }
.flip-in { position: relative; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.3,.7,.2,1); }
.item.flipped .flip-in { transform: rotateY(180deg); }
.face { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.face.back { position: absolute; inset: 0; transform: rotateY(180deg); overflow: hidden; border-radius: 3px; border: 5px solid #2a2823; background: var(--screen); box-shadow: 0 0 0 1px #8f866f; }
.face.back { display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; }
.face.back::before { content: ''; position: absolute; inset: 0; background: rgba(16,15,12,.55); }
.face.back iframe { position: relative; display: block; width: calc(100% - 16px); margin: 0 8px 8px; height: 80px; border: 0; border-radius: 12px; }
.sp-fallback { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; text-align: center; color: var(--amber); font-family: var(--font-crt); font-size: 18px; line-height: 1.1; }
.sp-fallback .btn { margin-top: 8px; }
.sp-fallback small { font-size: 15px; color: var(--amber-dim); }
.play { all: unset; box-sizing: border-box; cursor: pointer; align-self: flex-start; padding: 7px 12px; border-radius: 3px; font-family: var(--font-display); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: linear-gradient(#f4efe3, #d2c9b4); border: 1px solid #8f866f; box-shadow: 0 3px 0 #8f866f; }
.play[aria-pressed="true"] { background: var(--s1); color: #fff7ea; border-color: #9e3417; box-shadow: 0 1px 0 #9e3417, inset 0 2px 3px rgba(0,0,0,.2); transform: translateY(2px); }
.nosp { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; padding: 6px 0 2px; }
.open:focus-visible, .play:focus-visible { outline: 3px solid var(--s4); outline-offset: 3px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.alt { background: linear-gradient(#f4efe3, #d2c9b4); color: var(--ink); border-color: #8f866f; box-shadow: 0 4px 0 #8f866f; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }
.disc { width: 70%; height: 70%; }
.cat { position: absolute; left: 8px; bottom: 6px; font-family: var(--font-mono); font-size: 10px; color: #ddd; }
.meta { display: flex; flex-direction: column; gap: 3px; padding: 7px 4px 0; min-width: 0; border-top: 2px solid; border-image: linear-gradient(90deg, var(--s1) 0 25%, var(--s2) 25% 50%, var(--s3) 50% 75%, var(--s4) 75%) 1; }
.meta .t1 { font-weight: 600; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.meta .t2 { color: var(--ink-2); font-size: 12px; line-height: 1.3; overflow-wrap: anywhere; }
.price { margin-top: 7px; display: inline-flex; align-self: flex-start; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .08em;
  padding: 3px 8px; border-radius: 2px; background: #1d1c19; color: #f6f2e8; text-shadow: 0 -1px 0 rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.15); font-variant-numeric: tabular-nums; }
.price.none { background: transparent; color: var(--ink-2); border: 1px dashed var(--panel-edge); text-shadow: none; font-weight: 400; letter-spacing: 0; }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-2); }

dialog { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: min(740px, calc(100vw - 24px)); width: 100%; max-height: calc(100vh - 24px); overflow: visible; margin: auto; }
dialog::backdrop { background: rgba(24,18,8,.62); }
.sheet { position: relative; display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 22px; padding: 22px; max-height: calc(100vh - 24px); overflow-y: auto; }
.sheet .art.pt { max-width: 220px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.25; letter-spacing: .03em; margin: 4px 0 4px; text-wrap: balance; overflow-wrap: anywhere; }
.sheet .by { color: var(--ink-2); margin: 0 0 14px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 18px; font-size: 13px; }
.facts dt { color: var(--ink-2); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.val { position: relative; overflow: hidden; padding: 14px 16px 16px; border-radius: 10px / 14px; background: var(--screen); color: var(--amber); border: 3px solid #2d2b25; box-shadow: inset 0 0 22px rgba(0,0,0,.85), 0 0 0 3px #bdb39c; }
.val::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); }
.val .now { font-family: var(--font-display); font-size: 30px; line-height: 1.1; color: var(--amber); text-shadow: 0 0 6px rgba(255,170,60,.65); font-variant-numeric: tabular-nums; }
.val .now small { font-family: var(--font-crt); font-size: 18px; color: var(--amber-dim); margin-left: 8px; text-shadow: none; }
.range { position: relative; height: 10px; margin: 18px 6px 8px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--amber-dim) 0 2px, transparent 2px 8px); }
.range i { position: absolute; top: 50%; width: 6px; height: 20px; background: var(--amber); box-shadow: 0 0 8px var(--amber); transform: translate(-50%, -50%); }
.rl { display: flex; justify-content: space-between; font-family: var(--font-crt); font-size: 18px; color: var(--amber-dim); }
.note { font-family: var(--font-crt); font-size: 18px; line-height: 1.15; color: var(--amber-dim); margin: 10px 0 0; }
.btn { display: inline-flex; margin-top: 16px; padding: 10px 16px; border-radius: 4px; background: var(--s1); color: #fff7ea; text-decoration: none;
  font-family: var(--font-display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid #9e3417; box-shadow: 0 4px 0 #9e3417; }
.close { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 4px; display: grid; place-items: center; z-index: 2;
  background: linear-gradient(#f4efe3, #d2c9b4); border: 1px solid #8f866f; box-shadow: 0 3px 0 #8f866f; font-size: 18px; line-height: 1; color: var(--ink); }
.foot { color: var(--ink-2); font-size: 12px; padding: 8px 2px 0; max-width: 72ch; }

@media (max-width: 860px) { .totals { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) {
  .totals { grid-template-columns: 1fr; }
  .sheet { grid-template-columns: 1fr; padding: 18px; }
  .sheet .art { max-width: 200px; }
  .seg button { padding: 10px 12px 9px 26px; }
}
@media (prefers-reduced-motion: reduce) { .item, .seg button { transition: none; } .item:hover { transform: none; } }
</style>

<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="stamp">Values in CAD · Discogs sales, sheet prices and store prices as of Oct 27, 2026</div>
  </header>

  <section class="glass totals" aria-label="Collection totals">
    <button class="total" id="tot-v" data-tab="vinyl" type="button">
      <span class="eyebrow">Vinyl records</span>
      <span class="big" id="v-big"></span>
      <span class="sub" id="v-sub"></span>
    </button>
    <button class="total" id="tot-p" data-tab="photocards" type="button">
      <span class="eyebrow">K-pop photocards</span>
      <span class="big" id="p-big"></span>
      <span class="sub" id="p-sub"></span>
    </button>
    <button class="total" id="tot-s" data-tab="setup" type="button">
      <span class="eyebrow">Desk setup</span>
      <span class="big" id="s-big"></span>
      <span class="sub" id="s-sub"></span>
    </button>
    <div class="combined"><span>Everything</span><span id="all-line"></span></div>
  </section>

  <div class="bar-row">
    <div class="glass seg" role="tablist" aria-label="Collection">
      <button role="tab" id="tab-vinyl" data-tab="vinyl" type="button">Side A · Vinyl <span id="n-v"></span></button>
      <button role="tab" id="tab-photocards" data-tab="photocards" type="button">Side B · Photocards <span id="n-p"></span></button>
      <button role="tab" id="tab-setup" data-tab="setup" type="button">Side C · Setup <span id="n-s"></span></button>
    </div>
    <div class="tools" id="tools"></div>
  </div>

  <section class="glass split" id="split" aria-label="Value breakdown"></section>

  <div class="chips" id="chips" role="group" aria-label="Filter"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>
</div>

const V = DATA.vinyl, P = DATA.cards, S = DATA.setup;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'CA$' + n.toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = n => 'CA$' + Math.round(n).toLocaleString('en-CA');
const bigMoney = n => '<small>CA$</small>' + Math.round(n).toLocaleString('en-CA');
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const fmtDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-CA', {year: 'numeric', month: 'short', day: 'numeric'});

const vMed = sum(V, v => v.med), vLow = sum(V, v => v.low), vHigh = sum(V, v => v.high);
const pTot = sum(P, c => c.price);
const sTot = sum(S, x => x.price);
const vValued = V.filter(v => v.med != null).length;
const pPriced = P.filter(c => c.price != null).length;

$('v-big').innerHTML = bigMoney(vMed);
$('v-sub').textContent = V.length + ' records · typical sale value, range ' + money0(vLow) + ' to ' + money0(vHigh);
$('p-big').innerHTML = bigMoney(pTot);
$('p-sub').textContent = P.length + ' cards · priced from POCA Market, eBay when not listed';
$('s-big').innerHTML = bigMoney(sTot);
$('s-sub').textContent = S.length + ' pieces · keyboard, mousepad, mouse, IEM at current prices';
$('all-line').innerHTML = '<b>' + money0(vMed + pTot + sTot) + '</b> across ' + (V.length + P.length + S.length) + ' items';
$('n-v').textContent = V.length; $('n-p').textContent = P.length; $('n-s').textContent = S.length;

const hueV = v => 195 + (v.id % 61);
const GH = {'ITZY': 205, 'aespa': 250, 'Le Sserafim': 178, 'Other': 280};

function discSvg(v) {
  const h = hueV(v);
  let g = '';
  for (let r = 22; r <= 46; r += 3.2) g += '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width=".6"/>';
  return '<svg class="disc" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="#0f2236"/>' + g +
    '<path d="M50 50 L92 28 A49 49 0 0 1 92 72 Z" fill="rgba(255,255,255,.07)"/>' +
    '<circle cx="50" cy="50" r="16" fill="hsl(' + h + ' 75% 72%)"/><circle cx="50" cy="50" r="2.4" fill="#0f2236"/></svg>';
}
function vArt(v) {
  return '<div class="art sq" style="--h:' + hueV(v) + '">' + (v.img ? '<img src="' + esc(v.img) + '" alt="' + esc(v.title + ' by ' + v.artist) + '" loading="lazy">' : discSvg(v) + '<span class="cat">' + esc(v.cat === 'none' ? 'no cat. no.' : v.cat) + '</span>') + '</div>';
}
function pArt(c, big) {
  return '<div class="art pt" style="--h:' + GH[c.group] + '">' + (c.img ? '<img src="' + esc(c.img) + '" alt="' + esc(c.member + ', ' + (c.album ? c.album + ', ' : '') + c.ver) + '" loading="lazy">' : '') + '</div>';
}

const state = {tab: 'vinyl', q: '', sort: 'value', chip: 'All', member: 'All'};
const sorts = {
  vinyl: [['value', 'Value, high to low'], ['artist', 'Artist A to Z'], ['year-asc', 'Year, oldest first'], ['year-desc', 'Year, newest first'], ['added', 'Recently added']],
  photocards: [['value', 'Value, high to low'], ['value-asc', 'Value, low to high'], ['member', 'Member A to Z'], ['album', 'Album A to Z']]
};

function tabFromHash() { return location.hash === '#photocards' ? 'photocards' : location.hash === '#setup' ? 'setup' : 'vinyl'; }
function sArt(x) { return '<div class="art sq">' + '<img src="' + esc(x.img) + '" alt="' + esc(x.name) + '" loading="lazy"></div>'; }
function setTab(t, push) {
  state.tab = t; state.q = ''; state.sort = 'value'; state.chip = 'All'; state.member = 'All';
  if (push && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  buildAll();
}

function buildSplit() {
  if (state.tab === 'setup') {
    const cols = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];
    const rows = S.slice().sort((a, b) => b.price - a.price);
    $('split').innerHTML = '<div class="eyebrow">Setup value by piece</div>' +
      '<div class="bar" role="img" aria-label="' + esc(rows.map(r => r.cat + ' ' + money0(r.price)).join(', ')) + '">' + rows.map((r, i) => '<i style="flex:' + (r.price / sTot) + ';--c:' + cols[i % 4] + '"></i>').join('') + '</div>' +
      '<div class="legend">' + rows.map((r, i) => '<span><em style="background:' + cols[i % 4] + '"></em>' + esc(r.cat) + ' <b>' + money0(r.price) + '</b></span>').join('') + '</div>';
    return;
  }
  const isV = state.tab === 'vinyl';
  const key = isV ? 'scene' : 'group', items = isV ? V : P, val = isV ? (x => x.med) : (x => x.price);
  const order = []; items.forEach(x => { if (!order.includes(x[key])) order.push(x[key]); });
  const rows = order.map(k => ({k, n: items.filter(x => x[key] === k).length, s: sum(items.filter(x => x[key] === k), val)})).sort((a, b) => b.s - a.s);
  const total = rows.reduce((t, r) => t + r.s, 0) || 1;
  const cols = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];
  $('split').innerHTML = '<div class="eyebrow">' + (isV ? 'Vinyl value by scene' : 'Photocard value by group') + '</div>' +
    '<div class="bar" role="img" aria-label="' + esc(rows.map(r => r.k + ' ' + money0(r.s)).join(', ')) + '">' + rows.map((r, i) => '<i style="flex:' + (r.s / total) + ';--c:' + cols[i % 4] + '"></i>').join('') + '</div>' +
    '<div class="legend">' + rows.map((r, i) => '<span><em style="background:' + cols[i % 4] + '"></em>' + esc(r.k === 'Other' && !isV ? 'Other groups' : r.k) + ' <b>' + money0(r.s) + '</b> <u>' + r.n + (isV ? (r.n === 1 ? ' record' : ' records') : ' cards') + '</u></span>').join('') + '</div>';
}

function buildControls() {
  if (state.tab === 'setup') { $('tools').innerHTML = ''; $('chips').innerHTML = ''; return; }
  const isV = state.tab === 'vinyl';
  const sel = '<select id="sort" aria-label="Sort">' + sorts[state.tab].map(([v, l]) => '<option value="' + v + '"' + (state.sort === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';
  let mem = '';
  if (!isV) {
    const pool = P.filter(c => state.chip === 'All' || c.group === state.chip);
    const names = [...new Set(pool.map(c => c.member))].sort();
    mem = '<select id="member" aria-label="Member"><option value="All">All members</option>' + names.map(n => '<option' + (state.member === n ? ' selected' : '') + '>' + esc(n) + '</option>').join('') + '</select>';
  }
  $('tools').innerHTML = '<input id="q" type="search" placeholder="' + (isV ? 'Search artist, title, label' : 'Search member, album, store') + '" value="' + esc(state.q) + '" aria-label="Search">' + mem + sel;
  $('q').addEventListener('input', e => { state.q = e.target.value; buildGrid(); });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; buildGrid(); });
  if (!isV) $('member').addEventListener('change', e => { state.member = e.target.value; buildGrid(); });

  const key = isV ? 'scene' : 'group', items = isV ? V : P;
  const names = ['All', ...new Set(items.map(x => x[key]))];
  $('chips').innerHTML = names.map(n => {
    const c = n === 'All' ? items.length : items.filter(x => x[key] === n).length;
    return '<button class="chip" type="button" data-chip="' + esc(n) + '" aria-pressed="' + (state.chip === n) + '">' + esc(n === 'Other' && !isV ? 'Other groups' : n) + '<span>' + c + '</span></button>';
  }).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    state.chip = b.dataset.chip; state.member = 'All'; buildControls(); buildGrid();
  }));
}

function filtered() {
  const isV = state.tab === 'vinyl', q = state.q.trim().toLowerCase();
  let a = isV ? V.slice() : P.slice();
  if (state.chip !== 'All') a = a.filter(x => (isV ? x.scene : x.group) === state.chip);
  if (!isV && state.member !== 'All') a = a.filter(x => x.member === state.member);
  if (q) a = a.filter(x => (isV ? [x.artist, x.title, x.alt, x.label, x.cat, x.year, x.notes.join(' ')] : [x.member, x.album, x.ver, x.group]).join(' ').toLowerCase().includes(q));
  const s = state.sort, val = isV ? (x => x.med) : (x => x.price);
  const byVal = (x, y, dir) => (val(x) == null) - (val(y) == null) || dir * ((val(y) ?? 0) - (val(x) ?? 0));
  const cmp = {
    value: (x, y) => byVal(x, y, 1), 'value-asc': (x, y) => (val(x) == null) - (val(y) == null) || (val(x) ?? 0) - (val(y) ?? 0),
    artist: (x, y) => x.artist.localeCompare(y.artist) || x.year - y.year,
    'year-asc': (x, y) => x.year - y.year, 'year-desc': (x, y) => y.year - x.year,
    added: (x, y) => y.added.localeCompare(x.added) || x.artist.localeCompare(y.artist),
    member: (x, y) => x.member.localeCompare(y.member) || x.album.localeCompare(y.album), album: (x, y) => x.album.localeCompare(y.album) || x.member.localeCompare(y.member)
  }[s];
  return a.sort(cmp);
}

function buildGrid() {
  if (state.tab === 'setup') {
    $('count').innerHTML = '<b>' + S.length + '</b> pieces · worth <b>' + money(sTot) + '</b>';
    $('grid').className = 'grid s';
    const pos = {Keyboard: ['kb', 'img/d/keyboard.jpg'], Mousepad: ['pad', 'img/d/mousepad.jpg'], Mouse: ['mouse', 'img/d/mouse.png'], IEM: ['iem', 'img/d/iem.png']};
    const order = ['Mousepad', 'Keyboard', 'Mouse', 'IEM'];
    $('grid').innerHTML = '<div class="desk" role="group" aria-label="Desk setup">' + order.map(k => S.find(x => x.cat === k)).filter(Boolean).map(x =>
      '<button class="thing ' + pos[x.cat][0] + '" type="button" data-sid="' + x.id + '" aria-label="' + esc(x.cat + ': ' + x.name + ', ' + money(x.price)) + '"><img src="' + pos[x.cat][1] + '" alt=""><span class="tag">' + esc(x.cat) + '<b>' + money0(x.price) + '</b></span></button>').join('') + '</div>' +
      '<div class="rack">' + S.map(x => '<button type="button" data-sid="' + x.id + '"><span class="k">' + esc(x.cat) + '</span><span class="n">' + esc(x.name) + '</span><span class="m">' + esc(x.maker) + '</span><span class="pr">' + money(x.price) + '</span></button>').join('') + '</div>';
    return;
  }
  const isV = state.tab === 'vinyl', a = filtered();
  const val = isV ? (x => x.med) : (x => x.price);
  $('count').innerHTML = 'Showing <b>' + a.length + '</b> of ' + (isV ? V.length : P.length) + (isV ? ' records' : ' cards') + ' · worth <b>' + money(sum(a, val)) + '</b>';
  $('grid').className = 'grid ' + (isV ? 'v' : 'p');
  if (!a.length) { $('grid').innerHTML = '<div class="empty">Nothing matches that search.</div>'; return; }
  $('grid').innerHTML = a.map(x => {
    if (isV) return '<div class="item vi" data-vid="' + x.id + '"><div class="flip"><div class="flip-in"><div class="face front"><button class="open" type="button" data-id="' + x.id + '" aria-label="Details for ' + esc(x.title) + '">' + vArt(x) + '</button></div><div class="face back"></div></div></div>' +

      (x.price != null ? '<span class="price">' + money(x.price) + '</span>' : '<span class="price none">No price yet</span>') + '</span></button>';
  }).join('');
}

function buildFoot() {
  if (state.tab === 'setup') { $('foot').textContent = 'Setup values are current new prices on Oct 27, 2026, converted to CAD at 1 USD = 1.403 CAD where the store lists US dollars. The QK75 is no longer sold new, so it uses a market estimate. Switch cost assumes 90 switches for the 75% board.'; return; }
  $('foot').textContent = state.tab === 'vinyl'

      '<dl class="facts">' + x.specs.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' +
      '<div class="val"><div class="now">' + money(x.price) + '<small>current price</small></div>' +
      (x.parts.length > 1 ? '<ul class="parts">' + x.parts.map(p => '<li><span>' + esc(p.label) + '</span><span>' + money(p.price) + '</span></li>').join('') + '</ul>' : '') +
      '<p class="note">' + esc(x.parts.map(p => p.basis).join('. ')) + '.</p></div>' +
      '<div class="btns">' + x.links.map(([l, u], i) => '<a class="btn' + (i ? ' alt' : '') + '" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(l) + '</a>').join('') + '</div></div>';
    $('sheet').innerHTML = h;
    $('x').addEventListener('click', () => $('dlg').close());
    if (!$('dlg').open) $('dlg').showModal();
    return;
  }
  const isV = state.tab === 'vinyl';
  const x = (isV ? V : P).find(i => i.id === id); if (!x) return;
  let h = '<button class="close" type="button" aria-label="Close" id="x">&times;</button>';
  if (isV) {
    const notes = [x.format, ...x.notes].join(', ');
    const cond = x.media ? x.media + ' media, ' + x.sleeve + ' sleeve' : '';
    h += '<div>' + vArt(x) + '</div><div><div class="eyebrow">' + esc(x.scene === 'Japan' ? 'Japanese pressing or artist' : x.scene) + '</div><h2>' + esc(x.title) + '</h2><p class="by">' + esc(x.artist) + (x.alt ? ' · ' + esc(x.alt) : '') + '</p>' +
      '<dl class="facts"><dt>Label</dt><dd>' + esc(x.label) + '</dd><dt>Catalog no.</dt><dd>' + esc(x.cat === 'none' ? 'None printed' : x.cat) + '</dd><dt>Released</dt><dd>' + x.year + '</dd><dt>Format</dt><dd>' + esc(notes) + '</dd>' +
      (cond ? '<dt>Condition</dt><dd>' + esc(cond) + '</dd>' : '') + '<dt>Added</dt><dd>' + fmtDate(x.added) + '</dd></dl>';
    if (x.med != null) {
      const pos = x.high > x.low ? (x.med - x.low) / (x.high - x.low) * 100 : 50;
      h += '<div class="val"><div class="now">' + money(x.med) + '<small>typical sale</small></div><div class="range" role="img" aria-label="Low ' + money(x.low) + ', median ' + money(x.med) + ', high ' + money(x.high) + '"><i style="left:' + pos + '%"></i></div>' +
        '<div class="rl"><span>Low ' + money(x.low) + '</span><span>High ' + money(x.high) + '</span></div><p class="note">Last sold ' + fmtDate(x.sold) + '. ' + x.have.toLocaleString('en-CA') + ' Discogs collectors own this release.</p></div>';
    } else h += '<div class="val"><div class="now">No sales yet</div><p class="note">Nobody has sold this release on Discogs, so it has no value and is not counted in the total.</p></div>';
    h += '<div class="btns">' + (x.sp ? '<a class="btn" href="' + spUrl(x.sp) + '" target="_blank" rel="noopener">▶ Listen on Spotify</a>' : '') + '<a class="btn alt" href="https://www.discogs.com/release/' + x.id + '" target="_blank" rel="noopener">View on Discogs</a></div></div>';
  } else {
    h += '<div>' + pArt(x) + '</div><div><div class="eyebrow">' + esc(x.group === 'Other' ? 'Other groups' : x.group) + '</div><h2>' + esc(x.member) + '</h2><p class="by">' + esc(x.album || 'Photocard') + '</p>' +
      '<dl class="facts"><dt>Version</dt><dd>' + esc(x.ver) + '</dd>' + (x.album ? '<dt>Album</dt><dd>' + esc(x.album) + '</dd>' : '') + '<dt>Member</dt><dd>' + esc(x.member) + '</dd></dl>' +
      '<div class="val"><div class="now">' + (x.price != null ? money(x.price) : 'No price yet') + (x.price != null ? '<small>current value</small>' : '') + '</div>' +
      '<p class="note">' + (x.price != null ? 'Priced from POCA Market, with eBay when POCA Market has no listing.' : 'This card has no price in the sheet, so it is not counted in the total.') + '</p></div></div>';
  }
  $('sheet').innerHTML = h;
  $('x').addEventListener('click', () => $('dlg').close());
  if (!$('dlg').open) $('dlg').showModal();
}
let canEmbed = false; try { canEmbed = window.top === window.self; } catch (e) {}
const spUrl = id => 'https://open.spotify.com/album/' + id;
function unflip(item) {
  if (!item || !item.classList.contains('flipped')) return;
  item.classList.remove('flipped');
  const k = item.querySelector('.play'); k.setAttribute('aria-pressed', 'false'); k.textContent = '▶ Play';
  const back = item.querySelector('.back'); setTimeout(() => { if (!item.classList.contains('flipped')) back.innerHTML = ''; }, 650);
}
function flip(item) {
  document.querySelectorAll('.item.flipped').forEach(o => { if (o !== item) unflip(o); });
  const x = V.find(v => v.id === Number(item.dataset.vid)); if (!x || !x.sp) return;
  item.querySelector('.back').style.backgroundImage = x.img ? 'url("' + x.img + '")' : '';
  item.querySelector('.back').innerHTML = canEmbed
    ? '<iframe title="' + esc(x.title) + ' on Spotify" height="80" src="https://open.spotify.com/embed/album/' + x.sp + '?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>'
    : '<div class="sp-fallback"><span>Side A loaded</span><a class="btn" href="' + spUrl(x.sp) + '" target="_blank" rel="noopener">Open in Spotify</a><small>The player appears on your published site.</small></div>';
  item.classList.add('flipped');
  const k = item.querySelector('.play'); k.setAttribute('aria-pressed', 'true'); k.textContent = '■ Stop';
}
$('grid').addEventListener('click', e => {
  const k = e.target.closest('.play'); if (k) { const it = k.closest('.item'); it.classList.contains('flipped') ? unflip(it) : flip(it); return; }
  const st = e.target.closest('[data-sid]'); if (st) { openItem(Number(st.dataset.sid)); return; }
  const o = e.target.closest('.open'); if (o) { openItem(Number(o.dataset.id)); return; }
  const b = e.target.closest('button.item'); if (b) openItem(Number(b.dataset.id));
});
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab, true)));
window.addEventListener('hashchange', () => { if (tabFromHash() !== state.tab) setTab(tabFromHash(), false); });
state.tab = tabFromHash(); buildAll();
</script>
